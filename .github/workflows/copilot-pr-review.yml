name: Copilot PR Review

on:
  pull_request_target:
    types:
      - opened

concurrency:
  group: copilot-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Post PR opened notes
        uses: actions/github-script@v8
        with:
          script: |
            const marker = "<!-- pr-opened-note -->";
            const issue_number = context.payload.pull_request.number;
            const pull_number = context.payload.pull_request.number;
            const { owner, repo } = context.repo;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number,
                per_page: 100,
              },
            );

            const postedBodies = new Set(
              comments
                .filter((comment) => comment.user?.login === "github-actions[bot]")
                .map((comment) => comment.body ?? ""),
            );

            const alreadyPostedOverview = comments.some(
              (comment) =>
                comment.user?.login === "github-actions[bot]" &&
                comment.body?.includes(marker),
            );

            if (!alreadyPostedOverview) {
              const body = [
                marker,
                "Thanks for opening this PR.",
                "",
                "A maintainer will review this change shortly.",
              ].join("\n");

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner,
                repo,
                pull_number,
                per_page: 100,
              },
            );

            for (const file of files) {
              const fileMarker = `<!-- pr-opened-file-note:${file.filename} -->`;
              const alreadyPostedForFile = [...postedBodies].some((body) =>
                body.includes(fileMarker),
              );

              if (alreadyPostedForFile) {
                continue;
              }

              const body = [
                fileMarker,
                `File changed: \`${file.filename}\``,
                "",
                `Status: ${file.status}`,
                `Additions: ${file.additions}, Deletions: ${file.deletions}`,
              ].join("\n");

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

            core.info(`Posted PR-opened notes for ${files.length} file(s).`);